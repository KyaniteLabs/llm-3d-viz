<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070C0B" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Model Observatory</title>
  </head>
  <body>
    <main class="observatory" aria-label="LLM benchmark observatory">
      <section class="stage panel" aria-labelledby="stage-title">
        <div class="region-heading">
          <p class="eyebrow">MODEL UNIVERSE / V0</p>
          <h1 id="stage-title">Speed × cost × intelligence</h1>
        </div>
        <div class="stage-placeholder" aria-label="3D benchmark stage placeholder">
          <span>3D STAGE / AWAITING INSTRUMENT DATA</span>
        </div>
      </section>

      <aside class="console panel" aria-labelledby="console-title">
      </aside>

      <section class="projection-row" aria-label="Linked two-dimensional projections">
        <article class="projection panel"><p class="eyebrow">SPEED / INTELLIGENCE</p><span>PROJECTION 01</span></article>
        <article class="projection panel"><p class="eyebrow">SPEED / COST</p><span>PROJECTION 02</span></article>
        <article class="projection panel"><p class="eyebrow">COST / INTELLIGENCE</p><span>PROJECTION 03</span></article>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebApplication",
            "@id": "https://viz.kyanitelabs.tech/#app",
            "name": "Model Observatory",
            "alternateName": ["llm-3d-viz", "LLM 3D Viz"],
            "url": "https://viz.kyanitelabs.tech/",
            "description": "Interactive 3D visualization of LLM benchmarks across speed (tokens/s), cost (blended $/M), and intelligence (Artificial Analysis Index). Decide mode: set an intelligence floor and shortlist by cost or speed.",
            "applicationCategory": "DataVisualizationApplication",
            "operatingSystem": "Web browser",
            "browserRequirements": "Requires JavaScript and WebGL",
            "isAccessibleForFree": true,
            "license": "https://opensource.org/licenses/MIT",
            "offers": {
              "@type": "Offer",
              "price": "0",
              "priceCurrency": "USD"
            },
            "creator": {
              "@type": "Organization",
              "name": "Kyanite Labs",
              "url": "https://kyanitelabs.tech"
            },
            "featureList": [
              "3D stage: cost × intelligence × speed",
              "Decide mode with intelligence floor and cost/speed bias",
              "Multi-effort trails and Pareto ridge",
              "Open vs closed weight encoding",
              "Local VRAM tier filters (8/12/24 GB)",
              "Shareable URL state",
              "Atlas agent dock (offline tools + optional BYOK LLM)"
            ]
          },
          {
            "@type": "Dataset",
            "@id": "https://viz.kyanitelabs.tech/#catalog",
            "name": "Model Observatory curated LLM catalog",
            "description": "Curated per-model metrics for visualization: AA Intelligence Index, tokens/s, blended price, openness. Nulls preserved; metrics are never invented client-side.",
            "license": "https://opensource.org/licenses/MIT",
            "creator": { "@type": "Organization", "name": "Kyanite Labs" },
            "variableMeasured": [
              "aa_intelligence_index",
              "tps",
              "blended_price_per_M",
              "openness"
            ],
            "isBasedOn": [
              { "@type": "CreativeWork", "name": "Artificial Analysis", "url": "https://artificialanalysis.ai" },
              { "@type": "CreativeWork", "name": "OpenRouter list prices", "url": "https://openrouter.ai" },
              {
                "@type": "Dataset",
                "name": "LMSYS Chatbot Arena leaderboard dataset",
                "url": "https://huggingface.co/datasets/lmarena-ai/leaderboard-dataset",
                "license": "https://creativecommons.org/licenses/by/4.0/"
              }
            ]
          },
          {
            "@type": "WebSite",
            "@id": "https://viz.kyanitelabs.tech/#website",
            "url": "https://viz.kyanitelabs.tech/",
            "name": "Model Observatory",
            "publisher": { "@type": "Organization", "name": "Kyanite Labs" },
            "inLanguage": "en"
          }
        ]
      }
    </script>
  </head>
  <body>
    <div class="app-shell observatory" id="app-shell">
      <header class="scope-bar" aria-label="Visible set summary">
        <div class="scope-bar-brand">
          <p class="eyebrow" data-app-title>MODEL OBSERVATORY</p>
          <h1 id="stage-title" data-app-tagline>Speed × cost × intelligence</h1>
        </div>
        <button type="button" class="scope-summary" data-scope-edit aria-expanded="false" aria-controls="filter-shelf">
          <span class="scope-summary-text" data-scope-text>Loading scope…</span>
          <span class="scope-edit-label">Edit scope</span>
        </button>
        <div class="scope-bar-actions">
          <label class="scope-search">
            <span class="visually-hidden">Search models</span>
            <input type="search" data-global-search placeholder="Search models…" autocomplete="off" />
          </label>
          <button type="button" class="decide-toggle" data-decide-toggle aria-pressed="false" title="Intelligence floor + cost×speed shortlist">Decide</button>
          <button type="button" class="cinema-toggle" data-cinema-toggle aria-pressed="false">Cinema [C]</button>
        </div>
      </header>

      <aside class="filter-shelf" id="filter-shelf" aria-label="Filter shelf — edit visible set" hidden>
        <div class="filter-shelf-head">
          <p class="weight-heading">VISIBLE SET</p>
          <button type="button" class="text-link" data-scope-close>Close</button>
        </div>
        <div class="filter-shelf-body" data-filter-shelf></div>
        <div class="filter-shelf-foot">
          <button type="button" class="filter-clear" data-scope-reset>Reset draft</button>
          <button type="button" class="scope-apply" data-scope-apply>Apply scope</button>
        </div>
      </aside>

      <main class="canvas-host" data-canvas-mode="3d" aria-label="Analysis canvas">
        <div class="canvas-chrome" data-canvas-chrome>
          <div class="mode-tabs" role="tablist" aria-label="Canvas mode">
            <button type="button" role="tab" class="mode-tab is-active" data-mode="3d" aria-selected="true">3D</button>
            <button type="button" role="tab" class="mode-tab" data-mode="2d" aria-selected="false">2D</button>
            <button type="button" role="tab" class="mode-tab" data-mode="table" aria-selected="false">Table</button>
          </div>
          <div class="economy-toggle" role="group" aria-label="Cost and speed units">
            <button
              type="button"
              class="economy-chip is-active"
              data-economy-basis="rate"
              aria-pressed="true"
              title="Cost per million tokens · tokens per second"
            >
              $/M · tok/s
            </button>
            <button
              type="button"
              class="economy-chip"
              data-economy-basis="task"
              aria-pressed="false"
              title="Cost per AA Index task (when measured). Time is measured wall-time when available; otherwise estimated as TTFT + 1000/TPS."
            >
              $/task · s/task≈
            </button>
          </div>
        </div>

        <section class="stage panel" data-pane="3d" aria-labelledby="stage-title">
          <div class="stage-visual">
            <p class="story-line" data-story-line aria-live="polite"></p>
            <div class="stage-placeholder" aria-label="3D benchmark stage placeholder" data-stage-placeholder>
              <span>3D STAGE / AWAITING INSTRUMENT DATA</span>
            </div>
          </div>
          <aside class="stage-guide" aria-label="Stage legend and frontier model labels"></aside>
        </section>

        <section class="effort-strip panel" data-effort-strip hidden aria-label="Solo family effort ladder"></section>

        <section class="projection-row" data-pane="2d" hidden aria-label="Linked two-dimensional projections">
          <article class="projection panel"><p class="eyebrow">SPEED / INTELLIGENCE</p></article>
          <article class="projection panel"><p class="eyebrow">SPEED / COST</p></article>
          <article class="projection panel"><p class="eyebrow">COST / INTELLIGENCE</p></article>
        </section>

        <section class="table-pane panel" data-pane="table" hidden aria-label="Model membership table">
          <div data-membership-table></div>
        </section>
      </main>

      <aside class="inspector console panel" id="console-title" aria-label="Selection inspector">
        <!-- DecisionConsole + DecidePanel mount here -->
        <div class="atlas-mount" data-atlas-agent></div>
      </aside>

      <footer class="status-bar" aria-live="polite">
        <span data-status-text>Ready</span>
        <!-- W2 host lock: method strip in footer band (≤1 mono line). Content = W6.
             Cinema: method line via export overlay — status-bar hides under is-cinema. -->
        <span class="method-strip" data-method-strip aria-label="Data method summary"></span>
        <button type="button" class="text-link copy-insight" data-copy-insight>Copy insight</button>
        <span class="data-sources" data-data-sources>
          Data:
          <a href="https://artificialanalysis.ai" target="_blank" rel="noopener noreferrer">Artificial Analysis</a>
          (API) ·
          <a href="https://openrouter.ai" target="_blank" rel="noopener noreferrer">OpenRouter</a>
          (list prices) ·
          <a href="https://huggingface.co/datasets/lmarena-ai/leaderboard-dataset" target="_blank" rel="noopener noreferrer">Arena</a>
          (CC&nbsp;BY&nbsp;4.0)
        </span>
      </footer>
    </div>
    <noscript>
      <article class="seo-fallback" style="max-width:42rem;margin:2rem auto;padding:1rem;font-family:system-ui,sans-serif;line-height:1.5;color:#e8efe9;background:#070c0b">
        <h1>Model Observatory</h1>
        <p>

          <strong>speed × cost × intelligence</strong>. Compare models on Artificial Analysis

          intelligence floor and shortlist by cost or speed.
        </p>
        <p>
          JavaScript and WebGL are required for the live stage.
          Read the agent-facing brief at <a href="/llms.txt">/llms.txt</a>
          and product notes at <a href="/about.md">/about.md</a>.
        </p>
        <p>
          Data sources:
          <a href="https://artificialanalysis.ai">Artificial Analysis</a>,
          <a href="https://openrouter.ai">OpenRouter</a>,
          <a href="https://huggingface.co/datasets/lmarena-ai/leaderboard-dataset">Arena (CC BY 4.0)</a>.
          MIT licensed open source.
        </p>
      </article>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

name: Iolite Hermes plugin
on:
  push:
    branches: [main]
    paths: ["plugins/iolite-hermes/**", ".github/workflows/iolite-hermes-plugin.yml", "src/lib/decide.ts", "src/lib/pareto.ts", "src/data/models.ts", "src/config/fork-defaults.ts", "tests/decide.test.ts", "tests/iolite-plugin-parity.test.ts", "package.json", "package-lock.json"]
  pull_request:
    paths: ["plugins/iolite-hermes/**", ".github/workflows/iolite-hermes-plugin.yml", "src/lib/decide.ts", "src/lib/pareto.ts", "src/data/models.ts", "src/config/fork-defaults.ts", "tests/decide.test.ts", "tests/iolite-plugin-parity.test.ts", "package.json", "package-lock.json"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Plugin unit tests
        run: python -m pip install pytest==8.4.2 && cd plugins/iolite-hermes && python -m pytest -q
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install the repo's locked dependencies (runner's preinstalled node)
        run: npm ci --ignore-scripts
      - name: decide.ts against the plugin's golden file
        run: npx vitest run tests/iolite-plugin-parity.test.ts tests/decide.test.ts
  hermes-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          path: repo
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - name: Checkout tested Hermes runtime
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: NousResearch/hermes-agent
          ref: 2bd378ed1b8d6bf2192cb26e0a55ff3091e6bd19  # v0.23.0
          path: .hermes-runtime
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - name: Install Hermes from its own lockfile
        run: uv sync --frozen --python 3.14 --directory .hermes-runtime
      - name: Plugin tests under the Hermes runtime
        run: |
          uv pip install --python .hermes-runtime/.venv/bin/python pytest==8.4.2
          cd repo/plugins/iolite-hermes && ../../../.hermes-runtime/.venv/bin/python -m pytest -q
      - name: Real validator receipt (no credentials)
        run: |
          mkdir -p receipts
          HERMES_HOME="$RUNNER_TEMP/hermes-home" .hermes-runtime/.venv/bin/hermes plugins validate repo/plugins/iolite-hermes --json > receipts/validate.json
          python3 -c 'import json,sys; r=json.load(open("receipts/validate.json")); sys.exit(0 if r.get("ok") is True and not r.get("warnings") else 1)'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: plugin-validation
          path: receipts/

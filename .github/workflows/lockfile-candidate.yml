name: Lockfile candidate
on:
  pull_request:
    paths: [".github/workflows/lockfile-candidate.yml", "package.json", "package-lock.json"]
permissions:
  contents: read
jobs:
  candidate:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Generate bounded npm 10 candidate without lifecycle scripts
        run: |
          node --version
          npm --version
          test "$(npm --version | cut -d. -f1)" = 10
          npm update vite nanoid source-map-js --package-lock-only --ignore-scripts
          git diff --exit-code -- package.json
          node -e 'console.log("LOCK_CANDIDATE_BASE64="+Buffer.from(require("fs").readFileSync("package-lock.json")).toString("base64"))'
          npm ci --ignore-scripts
      - name: Report candidate advisories without hiding test failures
        continue-on-error: true
        run: npm audit --json
      - name: Validate root suites separately from known issue 15
        run: npx vitest run --exclude 'plugins/iolite-hermes/desktop-src/test/**'
      - name: Validate Desktop node suites
        if: always()
        run: npm --prefix plugins/iolite-hermes/desktop-src test
      - name: Validate build
        if: always()
        run: npm run build

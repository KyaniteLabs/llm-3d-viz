name: Lockfile verification
on:
  pull_request:
    paths: [".github/workflows/lockfile-candidate.yml", "package.json", "package-lock.json"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Resolve exact Vitest security floor without scripts
        run: |
          node --version
          npm --version
          test "$(npm --version | cut -d. -f1)" = 10
          node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync("package.json","utf8"));p.devDependencies.vitest="4.1.12";fs.writeFileSync("package.json",JSON.stringify(p,null,2)+"\n")'
          npm install --package-lock-only --ignore-scripts || { tail -100 "$HOME"/.npm/_logs/*debug-0.log; exit 1; }
          node -e 'for (const f of ["package.json","package-lock.json"]) console.log("CANDIDATE_"+f+"="+Buffer.from(require("fs").readFileSync(f)).toString("base64"))'
          npm ci --ignore-scripts
      - name: Report remaining advisories without hiding test failures
        continue-on-error: true
        run: npm audit --json
      - name: Validate root suites separately from known issue 15
        run: npx vitest run --exclude 'plugins/iolite-hermes/desktop-src/test/**'
      - name: Validate Desktop node suites
        if: always()
        run: npm --prefix plugins/iolite-hermes/desktop-src test
      - name: Validate build
        if: always()
        run: npm run build

name: iolite
label: Iolite
version: "0.2.4"
manifest_version: 2
api_version: 1
description: >
  Iolite picks an LLM the way the Iolite observatory does: set an intelligence
  floor (or name an anchor model), drop everything below it or missing price,
  speed or index, keep the cost x speed Pareto front, and rank it toward
  cheaper, faster or balanced. Two tools, iolite_shortlist and iolite_model,
  a /iolite slash command and a bundled skill. The decision logic is a tested
  port of the observatory's own. Disclosure:
  the plugin ships no model data and has no default source; it reads only
  what you configure, first match wins: the catalog_path file (no network) or
  the catalog_url (one plain GET sent as written, no credentials added and
  none accepted in the URL, cached in memory, 8 MB cap, same-origin redirects
  only). Ranking and sorting use only that catalog. If you also set
  IOLITE_AA_API_KEY (your own key, read through Hermes's secret scope), each
  answer makes one fetch of the Artificial Analysis free Data API (sent only
  to https://artificialanalysis.ai, redirects elsewhere refused, never
  retried, never logged) and shows its numbers beside the models already
  picked, labelled display only and credited "Source: Artificial Analysis
  (artificialanalysis.ai)". Those values are not cached, not written to disk
  and never used to rank. Benchmark and price data carry their providers'
  terms, so use a catalog you may use. No hooks, no files written; the one
  secret read is IOLITE_AA_API_KEY.
author: KyaniteLabs
license: MIT
requires_hermes: ">=0.23.0"
tags: [models, routing, cost, latency, pareto]
requires_env: []
optional_env:
  - name: IOLITE_AA_API_KEY
    description: "Your own free Artificial Analysis Data API key (https://artificialanalysis.ai/data-api). Display only: its numbers are shown beside the catalog's picks and never used to rank. Fetched once per answer, never stored."
    password: true
provides_tools: [iolite_shortlist, iolite_model]
config_schema:
  catalog_path:
    type: str
    default: ""
    description: "Set under plugins.entries.iolite.settings. Local catalog JSON: a list of rows or an object with a 'models' list (the shape of /api/v1/models.json). Wins over catalog_url."
  catalog_url:
    type: str
    default: ""
    description: "An Iolite /api/v1/models.json you are allowed to read, for example your own private instance. Empty means no network."
  cache_minutes:
    type: int
    default: 60
    description: "How long a fetched catalog is reused in memory."
  timeout_seconds:
    type: int
    default: 15
    description: "Time limit in seconds for a whole catalog_url or Artificial Analysis fetch, all pages included."

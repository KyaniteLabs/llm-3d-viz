name: iolite
label: Iolite
version: "0.2.4"
manifest_version: 2
api_version: 1
description: >
  Pick an LLM that is smart enough, then cheapest or fastest, in one tool
  call. Set an intelligence floor (or name an anchor model), drop everything
  below it or missing price, speed or score, keep the cost x speed Pareto
  front, and rank it toward cheaper, faster or balanced. Two tools,
  iolite_shortlist and iolite_model, a /iolite slash command and a bundled
  skill. The decision logic is a port of the observatory's own, checked by a
  golden file. Disclosure: the plugin ships no model data and has no default
  source; it reads only what you configure, first match wins: the
  catalog_path file (no network) or the catalog_url (one GET, https unless you
  set allow_http, sent as written with no credentials added; a user:password@
  URL is refused and a ?token= query is sent as written; cached in memory, 8
  MB cap, a deadline on the whole response, same-origin redirects only).
  Rows whose source or provenance names Artificial Analysis are refused.
  Benchmark and price data carry their providers' terms, so use a catalog you
  may use. No hooks and no secrets read; the plugin writes nothing. Hermes
  keeps tool results in session history like any tool output.
author: KyaniteLabs
license: MIT
requires_hermes: ">=0.23.0"
tags: [models, routing, cost, latency, pareto]
requires_env: []
provides_tools: [iolite_shortlist, iolite_model]
config_schema:
  catalog_path:
    type: str
    default: ""
    description: "Set under plugins.entries.iolite.settings. Local catalog JSON: a list of rows or an object with a 'models' list (the shape of /api/v1/models.json). Wins over catalog_url."
  catalog_url:
    type: str
    default: ""
    description: "An https URL of an Iolite /api/v1/models.json you are allowed to read, for example your own private instance. Empty means no network."
  allow_http:
    type: bool
    default: false
    description: "Allow a plain http catalog_url. Off by default; turn it on only for a trusted local network."
  cache_minutes:
    type: int
    default: 60
    description: "How long a fetched catalog is reused in memory."
  timeout_seconds:
    type: int
    default: 15
    description: "Time limit in seconds for a whole catalog_url fetch, redirects included."
